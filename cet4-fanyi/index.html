<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大学英语四级 · 翻译练习</title>
<style>
/* ============================================================
   墨水屏 + 老花眼 硬约束（与听力站同一套）
   · 正文 30px 起，行距宽松
   · 渐变全关，描边半透明
   · 控件用文字不用图标
   · 答案/解析默认收起（先做后看）
   ============================================================ */
:root{
  --fg:#000; --bg:#fff;
  --line:rgba(0,0,0,.34);
  --soft:rgba(0,0,0,.16);
  --dim:rgba(0,0,0,.62);
  --tint:rgba(0,0,0,.05);
  --fs:30px;
}
html.hc{
  --line:rgba(0,0,0,.62); --soft:rgba(0,0,0,.3);
  --dim:rgba(0,0,0,.82); --tint:rgba(0,0,0,.09);
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:var(--fs);line-height:1.75;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* ---- 顶栏 ---- */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1.5px solid var(--line);
}
.top-in{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;font-weight:700;flex:1 1 auto;line-height:1.4}
.btn{
  font:inherit;font-size:18px;background:var(--bg);color:var(--fg);
  border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;
  min-height:44px;line-height:1.5;flex:0 0 auto;
}
.btn:active{background:var(--tint)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn[disabled]{opacity:.4;cursor:default}

/* ---- 目录 ---- */
.cat{
  font-size:19px;font-weight:700;color:var(--dim);
  margin:22px 0 8px;padding-bottom:5px;border-bottom:1.5px solid var(--soft);
  letter-spacing:.04em;
}
.items{display:flex;flex-direction:column;gap:9px}
.item{
  display:block;width:100%;text-align:left;font:inherit;
  background:var(--bg);color:var(--fg);border:1.5px solid var(--line);
  border-radius:13px;padding:11px 14px;cursor:pointer;min-height:72px;
}
.item:active{background:var(--tint)}
.item b{display:block;font-size:24px;font-weight:700;line-height:1.45}
.item span{display:block;font-size:19px;color:var(--dim);line-height:1.5}
.item.done{border-style:solid;border-left-width:7px}
.item.done b::after{content:" · 已练";font-size:18px;font-weight:400;color:var(--dim)}

/* ---- 练习页 ---- */
.meta{font-size:19px;color:var(--dim);padding:12px 2px 4px;line-height:1.6}
.q{
  border:1.5px solid var(--line);border-radius:14px;padding:16px 15px;
  margin:10px 0 12px;background:var(--bg);
}
.q .zh{white-space:pre-wrap;word-break:break-word}
.hint{color:var(--dim);font-size:.88em}
.blank{color:var(--dim);border-bottom:1.5px dashed var(--line);padding:0 8px}

/* 操作行 */
.ops{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.ops .btn{font-size:20px;padding:6px 15px;min-height:48px}

/* 英文译文 */
.en{border:1.5px solid var(--line);border-radius:14px;padding:16px 15px;margin:0 0 12px}
.en p{margin:0 0 10px}
.en p:last-child{margin-bottom:0}
.en .sent{display:block}

/* 逐句对照 */
.pair{
  display:grid;grid-template-columns:44px 1fr;gap:2px 10px;
  border-top:1.5px solid var(--soft);padding:12px 0;
}
.pair:first-child{border-top:0;padding-top:2px}
.pair .no{
  grid-row:1/3;align-self:start;
  font-size:18px;color:var(--dim);border-left:4px solid var(--line);
  padding-left:8px;line-height:1.5;
}
.pair .pzh{word-break:break-word}
.pair .pen{color:var(--dim);font-size:.92em;word-break:break-word;margin-top:3px}
@media(min-width:640px){
  .pair{grid-template-columns:44px 1fr 1fr;gap:0 16px}
  .pair .no{grid-row:1}
  .pair .pen{grid-column:3;grid-row:1;margin-top:0}
}

/* 进阶译文 */
.en2{border-style:dashed}

/* 底部翻页 */
.nav{display:flex;gap:10px;margin:18px 0 0}
.nav .btn{flex:1;font-size:20px;min-height:52px;padding:6px 10px}
.hidden{display:none!important}
.timer{font-variant-numeric:tabular-nums;font-size:20px;min-width:74px;text-align:right}
.foot{margin:26px 0 0;padding-top:14px;border-top:1.5px solid var(--soft);font-size:17px;color:var(--dim);line-height:1.7}
a{color:var(--fg)}
</style>
</head>

const DATA = [{"id":"ko-低碳生活","title":"低碳生活","source":"2024上半年 训练题","url":"https://cet4.koolearn.com/20240409/903602.html","zh":"低碳生活(low-carbon life)对于我们普通人来说是一种态度，我们应该积极提倡并去实践，从自己做起，从节约水电这些点滴做起。除了植树，有的人买运输里程很短的商品，还有人坚持爬楼梯，形形色色，非常有趣。“低碳生活”的理念逐渐被世界各国所接受。低碳生活的出现不仅告诉人们可以为减碳做些什么，还告诉人们可以怎么做。在这种生活方式逐渐兴起的时候，大家开始关心自己每天是否为减碳做了什么。","en":"Low-carbon life is an attitude for ordinary people, and we should actively advocate and practice low-carbon life by doing it from ourselves and by starting bit by bit from saving water and electricity. Besides planting trees, some people purchase goods within a short delivery distance and others stick to climbing stairs. People do various things to live a low-carbon life, which is really interesting. \"Low-carbon life\" concept has gradually been accepted worldwide. The emergence of low-carbon lifestyle not only introduces to people what they cando for carbon reduction, but also tells them how they cando it. As this lifestyle gradually becomes popular, people begin to ask themselves whether they have contributed something to carbon reduction every day.","en2":"","note":"","no":1,"zs":["低碳生活(low-carbon life)对于我们普通人来说是一种态度，我们应该积极提倡并去实践，从自己做起，从节约水电这些点滴做起。","除了植树，有的人买运输里程很短的商品，还有人坚持爬楼梯，形形色色，非常有趣。","“低碳生活”的理念逐渐被世界各国所接受。","低碳生活的出现不仅告诉人们可以为减碳做些什么，还告诉人们可以怎么做。","在这种生活方式逐渐兴起的时候，大家开始关心自己每天是否为减碳做了什么。"],"es":["Low-carbon life is an attitude for ordinary people, and we should actively advocate and practice low-carbon life by doing it from ourselves and by starting bit by bit from saving water and electricity.","Besides planting trees, some people purchase goods within a short delivery distance and others stick to climbing stairs.","People do various things to live a low-carbon life, which is really interesting.","\"Low-carbon life\" concept has gradually been accepted worldwide.","The emergence of low-carbon lifestyle not only introduces to people what they cando for carbon reduction, but also tells them how they cando it.","As this lifestyle gradually becomes popular, people begin to ask themselves whether they have contributed something to carbon reduction every day."],"p":[[0,1,0,1],[1,2,1,3],[2,3,3,4],[3,4,4,5],[4,5,5,6]],"zhLen":194,"enWords":117,"zhSents":5,"enSents":6,"cat":"其他训练"},{"id":"ko-我的译诗原则","title":"我的译诗原则","source":"翻译精选(59)","url":"https://cet4.koolearn.com/20240705/906067.html","zh":"我是个翻译实践者，不是纯理论家，在此无意提出似乎放之四海而皆准的抽象理论，而意在对自己多年的翻译(尤其是诗译)经验做一些总结，从中归纳出“几要几不要”，作为也许只适用于我自己的个人理论或主张。我所谓“准确”大略相当于严复的“信”。严夫子说：“求其信而大难矣”。我说：“信则万事毕矣”。准确有很多方面的含义。首先是意义的准确，这似乎无庸赘言。但是，诗与散文不同，它的内容与形式是有机地统一的，换句话说，即诗的意义至少部分是体现在形式之中的。所以，翻译散文可以“得意而忘言”，译诗则不可以。","en":"I am a translation practicer, not a pure theorist. Therefore, what I am intending to put forward here is not any abstract theory that seems to be universally true, but a summary of my years of translation experience, especially that of poetry translation, in the from of Dos and Don'ts, as personal theory or principle applied perhaps only to me myself. \"Accuracy\" I have mentioned roughly equals to \"faithfulness\" advocated by Yan Fu. Master Yan once said,\"Faithfulness is hard enough to attain\", while, to me,\"faithfulness is everything\". Accuracy has more than one.implications. First of all, it's needless to say that it implies the exactness of meaning. Yet, poetry is different from prose in that the content and form of poetry are organically integrated. In other words, the meaning of poetry is partly conveyed through its original form at least. Therefore, we may focus on the meaning ignoring the exact words used when translating prose, but it is not the case when translating poems. 1.","en2":"","note":"","no":2,"zs":["我是个翻译实践者，不是纯理论家，在此无意提出似乎放之四海而皆准的抽象理论，而意在对自己多年的翻译(尤其是诗译)经验做一些总结，从中归纳出“几要几不要”，作为也许只适用于我自己的个人理论或主张。","我所谓“准确”大略相当于严复的“信”。","严夫子说：“求其信而大难矣”。","我说：“信则万事毕矣”。","准确有很多方面的含义。","首先是意义的准确，这似乎无庸赘言。","但是，诗与散文不同，它的内容与形式是有机地统一的，换句话说，即诗的意义至少部分是体现在形式之中的。","所以，翻译散文可以“得意而忘言”，译诗则不可以。"],"es":["I am a translation practicer, not a pure theorist.","Therefore, what I am intending to put forward here is not any abstract theory that seems to be universally true, but a summary of my years of translation experience, especially that of poetry translation, in the from of Dos and Don'ts, as personal theory or principle applied perhaps only to me myself.","\"Accuracy\" I have mentioned roughly equals to \"faithfulness\" advocated by Yan Fu.","Master Yan once said,\"Faithfulness is hard enough to attain\", while, to me,\"faithfulness is everything\".","Accuracy has more than one.implications.","First of all, it's needless to say that it implies the exactness of meaning.","Yet, poetry is different from prose in that the content and form of poetry are organically integrated.","In other words, the meaning of poetry is partly conveyed through its original form at least.","Therefore, we may focus on the meaning ignoring the exact words used when translating prose, but it is not the case when translating poems."],"p":[[0,1,0,2],[1,2,2,3],[2,4,3,4],[4,5,4,5],[5,6,5,6],[6,7,6,8],[7,8,8,9]],"zhLen":243,"enWords":164,"zhSents":8,"enSents":9,"cat":"其他训练"},{"id":"ko-中国经济","title":"中国经济","source":"2024年12月(15)","url":"https://cet4.koolearn.com/20240725/906430.html","zh":"中国，地球上最吸引人的国家之一，有5000多年的历史，是目前全球第二大经济体(the second largest economy)。随着广泛的经济改革，中国正经历着显著、快速的变化。1949年以前的中国极端贫困、收入不平衡(income inequalities)、国家不安全。由于经济改革，从1980年开始，人民的生活水平开始提升至基本水平之上。全国人口有了足够的食物、衣服和住房，普通家庭可以吃得起各种各样的食物，穿得上时尚的衣服。","en":"China, one of the most fascinating countries on Earth, has a history of more than 5,000 years and is currently the second largest economy in the world. China is going through a remarkable and rapid change with widespread economic reforms. Before 1949, China was characterized by extreme poverty, income inequalities, and insecurity. Since 1980, thanks to the economic reforms, people's standard of living started to climb beyond the basic level. The general population had adequate food, clothing, and housing, and ordinary families could afford to eat a variety of foods and wear stylish clothing.","en2":"","note":"","no":3,"zs":["中国，地球上最吸引人的国家之一，有5000多年的历史，是目前全球第二大经济体(the second largest economy)。","随着广泛的经济改革，中国正经历着显著、快速的变化。","1949年以前的中国极端贫困、收入不平衡(income inequalities)、国家不安全。","由于经济改革，从1980年开始，人民的生活水平开始提升至基本水平之上。","全国人口有了足够的食物、衣服和住房，普通家庭可以吃得起各种各样的食物，穿得上时尚的衣服。"],"es":["China, one of the most fascinating countries on Earth, has a history of more than 5,000 years and is currently the second largest economy in the world.","China is going through a remarkable and rapid change with widespread economic reforms.","Before 1949, China was characterized by extreme poverty, income inequalities, and insecurity.","Since 1980, thanks to the economic reforms, people's standard of living started to climb beyond the basic level.","The general population had adequate food, clothing, and housing, and ordinary families could afford to eat a variety of foods and wear stylish clothing."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5]],"zhLen":219,"enWords":94,"zhSents":5,"enSents":5,"cat":"真题"},{"id":"ko-月光族","title":"月光族","source":"2024年12月(8)","url":"https://m.koolearn.com/cet4/20240724/906427.html","zh":"“月光族(the moonlight clan)”总是每个月花光收入，也没有存钱的计划。社会中有一小部分人是“月光族”。支持这种消费观念的人指出，作为月光族可以让他们拥有更多享受生活的机会，过高质量的生活。这种消费习惯在某种程度上也造成了浪费。月光族或许拥有奢华、高质量的生活，但是他们也会感到缺乏安全感，尤其是当手头拮据的时候。","en":"\"The moonlight clan\" always runs out of their income each month and has no plan to save money. There is a small number of \"the moonlight clan\" in our society. Those who are in favor of this kind of consumption attitude point out that being the moonlight clan gives them more chances to enjoy the life and live a high-quality life. This kind of consumption habit, to some extent, lead to waste. The moonlight clan may have a luxurious and high-quality life but they may be lack of the sense of security, especially in their rainy day.","en2":"","note":"","no":4,"zs":["“月光族(the moonlight clan)”总是每个月花光收入，也没有存钱的计划。","社会中有一小部分人是“月光族”。","支持这种消费观念的人指出，作为月光族可以让他们拥有更多享受生活的机会，过高质量的生活。","这种消费习惯在某种程度上也造成了浪费。","月光族或许拥有奢华、高质量的生活，但是他们也会感到缺乏安全感，尤其是当手头拮据的时候。"],"es":["\"The moonlight clan\" always runs out of their income each month and has no plan to save money.","There is a small number of \"the moonlight clan\" in our society.","Those who are in favor of this kind of consumption attitude point out that being the moonlight clan gives them more chances to enjoy the life and live a high-quality life.","This kind of consumption habit, to some extent, lead to waste.","The moonlight clan may have a luxurious and high-quality life but they may be lack of the sense of security, especially in their rainy day."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5]],"zhLen":165,"enWords":97,"zhSents":5,"enSents":5,"cat":"真题"},{"id":"ko-中国梦","title":"中国梦","source":"2024年12月(6)","url":"https://m.koolearn.com/cet4/20240724/906429.html","zh":"中国梦(the Chinese Dream)是中国的一个新名词。人们已经开始期待一个“梦想的国度”。因此，在中国人民的意识中，中国梦将会取代美国梦。期待“梦想国度”的中国人现在要放眼全世界。改革开放使中国发展的梦想变为现实。中国已经进入了一个新时代，在这个时代出生的每一个中国人都应该为他们的好运而感到高兴。","en":"The Chinese Dream is a new term in China. People have begun to expect a \"dream country\". In Chinese citizens' consciousness, therefore, the Chinese Dream will supersede the American Dream. The Chinese people, in expectations of a \"dream country\", are now opening their eyes to the world. Reform and opening-up has made the Chinese dream of development a reality. China has entered an new era, and every Chinese person born in this time should feel happy about their good fortune.","en2":"","note":"","no":5,"zs":["中国梦(the Chinese Dream)是中国的一个新名词。","人们已经开始期待一个“梦想的国度”。","因此，在中国人民的意识中，中国梦将会取代美国梦。","期待“梦想国度”的中国人现在要放眼全世界。","改革开放使中国发展的梦想变为现实。","中国已经进入了一个新时代，在这个时代出生的每一个中国人都应该为他们的好运而感到高兴。"],"es":["The Chinese Dream is a new term in China.","People have begun to expect a \"dream country\".","In Chinese citizens' consciousness, therefore, the Chinese Dream will supersede the American Dream.","The Chinese people, in expectations of a \"dream country\", are now opening their eyes to the world.","Reform and opening-up has made the Chinese dream of development a reality.","China has entered an new era, and every Chinese person born in this time should feel happy about their good fortune."],"p":[[0,4,0,4],[4,6,4,6]],"zhLen":154,"enWords":80,"zhSents":6,"enSents":6,"cat":"真题"},{"id":"ko-灯笼","title":"灯笼","source":"2019年6月","url":"https://cet4.koolearn.com/20190615/831232.html","zh":"灯笼起源于东汉，最初主要用于照明。在唐代，人们用红灯笼来庆祝安定的生活。从那时起，灯笼在中国的许多地方流行起来。灯笼通常用色彩鲜艳的薄纸制作，形状和尺寸各异。在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆节等节日期间悬挂。如今，世界上许多其他地方也能看到红灯笼。","en":"Lanterns, originating from the East Han Dynasty, were first mainly used for lighting. In the Tang Dynasty, the red lanterns were used to celebrate the peaceful life. Since then, they have become popular in many parts of China. Lanterns are usually made of thin papers of bright colors, in different shapes and sizes. Hung during the festivals such as the Spring Festival, the Lantern Festival and the National Festival, the red lanterns are the symbol of pleasant life and booming business in Chinese traditional culture. Nowadays, lanterns can be seen in many other places in the world.","en2":"","note":"【解析】\n灯笼起源于东汉，最初主要用于照明。\n解析：考查一主多动词的翻译技巧：同一个主语“灯笼”有两个动词“起源”和“用于”，选择其中一个动词为谓语，另一个动词为非谓语，介词等。考查被动结构翻译：“用于”译为“be\nused for”;灯笼：lantern;起源：originate from;东汉：East Han Dynasty;照明：lighting","no":6,"zs":["灯笼起源于东汉，最初主要用于照明。","在唐代，人们用红灯笼来庆祝安定的生活。","从那时起，灯笼在中国的许多地方流行起来。","灯笼通常用色彩鲜艳的薄纸制作，形状和尺寸各异。","在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节和国庆节等节日期间悬挂。","如今，世界上许多其他地方也能看到红灯笼。"],"es":["Lanterns, originating from the East Han Dynasty, were first mainly used for lighting.","In the Tang Dynasty, the red lanterns were used to celebrate the peaceful life.","Since then, they have become popular in many parts of China.","Lanterns are usually made of thin papers of bright colors, in different shapes and sizes.","Hung during the festivals such as the Spring Festival, the Lantern Festival and the National Festival, the red lanterns are the symbol of pleasant life and booming business in Chinese traditional culture.","Nowadays, lanterns can be seen in many other places in the world."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5],[5,6,5,6]],"zhLen":144,"enWords":97,"zhSents":6,"enSents":6,"cat":"真题"},{"id":"ko-乌镇","title":"乌镇","source":"文旅景点","url":"https://cet4.koolearn.com/20261020/941239.html","zh":"乌镇是浙江的一座古老水镇，坐落在京杭大运河畔。这是一处迷人的地方，有许多古桥、中式旅店和餐馆。在过去的一千年里，乌镇的水系和生活方式并未经历多少变化，是一座展现古文明的博物馆。乌镇所有房屋都用石木建造。数百年来，当地人沿着河边建起了住宅和集市。无数宽敞美丽的庭院藏身于屋舍之间，游客们每到一处都会有惊喜的发现。","en":"Wuzhen, an ancient water town of Zhejiang province, is located near the Beijing-Hangzhou Grand Canal. It is a charming place. Many ancient bridges, Chinese style hotels and restaurants dwell there. In the past one thousand years, the water system and the way of life there haven't changed much, so it is a museum of ancient civilizations. All rooms in Wuzhen are made of stone and wood. Over hundreds of years, the locals have built houses and markets along the riverbank. Numerous spacious and pretty courtyards hide in those houses, serving as surprises and waiting to be found by the tourists.","en2":"","note":"","no":7,"zs":["乌镇是浙江的一座古老水镇，坐落在京杭大运河畔。","这是一处迷人的地方，有许多古桥、中式旅店和餐馆。","在过去的一千年里，乌镇的水系和生活方式并未经历多少变化，是一座展现古文明的博物馆。","乌镇所有房屋都用石木建造。","数百年来，当地人沿着河边建起了住宅和集市。","无数宽敞美丽的庭院藏身于屋舍之间，游客们每到一处都会有惊喜的发现。"],"es":["Wuzhen, an ancient water town of Zhejiang province, is located near the Beijing-Hangzhou Grand Canal.","It is a charming place.","Many ancient bridges, Chinese style hotels and restaurants dwell there.","In the past one thousand years, the water system and the way of life there haven't changed much, so it is a museum of ancient civilizations.","All rooms in Wuzhen are made of stone and wood.","Over hundreds of years, the locals have built houses and markets along the riverbank.","Numerous spacious and pretty courtyards hide in those houses, serving as surprises and waiting to be found by the tourists."],"p":[[0,1,0,1],[1,2,1,3],[2,4,3,5],[4,5,5,6],[5,6,6,7]],"zhLen":155,"enWords":100,"zhSents":6,"enSents":7,"cat":"文旅景点"},{"id":"ko-峨眉山","title":"峨眉山","source":"文旅景点","url":"https://cet4.koolearn.com/20261023/941250.html","zh":"公元1世纪，在四川省峨嵋山景色秀丽的山巅上，落成了中国第一座佛教寺院。随着四周其他寺庙的建立，该地成为佛教的主要圣地之一。许多世纪以来，文化财富大量积淀，最著名的要属乐山大佛，它是8世纪时人们在一座山岩上雕凿出来的，俯瞰着三江交汇之所。佛像身高71米，堪称世界之最。峨嵋山还以其物种繁多、种类丰富的植物而闻名天下，从亚热带植物到亚高山针叶林可谓应有尽有，有些树木树龄已逾千年。","en":"The first Buddhist temple in China was built in Sichuan Province in the 1st century A.D. in the beautiful surroundings of the summit of Mount Emei. The addition of other temples turned the site into one of Buddhism's holiest sites. Over the centuries, the cultural treasures grew in number. The most remarkable is the Giant Buddha of Leshan, carved out of a hillside in the 8th century and looking down on the convergence of three rivers. At 71m high, it is the largest Buddha in the world. Mount Emei is also notable for its exceptionally diverse vegetation, ranging from subtropical to subalpine pine forests. Some of the trees there are more than 1,000 years old.","en2":"","note":"","no":8,"zs":["公元1世纪，在四川省峨嵋山景色秀丽的山巅上，落成了中国第一座佛教寺院。","随着四周其他寺庙的建立，该地成为佛教的主要圣地之一。","许多世纪以来，文化财富大量积淀，最著名的要属乐山大佛，它是8世纪时人们在一座山岩上雕凿出来的，俯瞰着三江交汇之所。","佛像身高71米，堪称世界之最。","峨嵋山还以其物种繁多、种类丰富的植物而闻名天下，从亚热带植物到亚高山针叶林可谓应有尽有，有些树木树龄已逾千年。"],"es":["The first Buddhist temple in China was built in Sichuan Province in the 1st century A.D.","in the beautiful surroundings of the summit of Mount Emei.","The addition of other temples turned the site into one of Buddhism's holiest sites.","Over the centuries, the cultural treasures grew in number.","The most remarkable is the Giant Buddha of Leshan, carved out of a hillside in the 8th century and looking down on the convergence of three rivers.","At 71m high, it is the largest Buddha in the world.","Mount Emei is also notable for its exceptionally diverse vegetation, ranging from subtropical to subalpine pine forests.","Some of the trees there are more than 1,000 years old."],"p":[[0,1,0,2],[1,2,2,3],[2,3,3,5],[3,4,5,6],[4,5,6,8]],"zhLen":188,"enWords":115,"zhSents":5,"enSents":8,"cat":"文旅景点"},{"id":"ko-阿房宫遗址","title":"阿房宫遗址","source":"旅游景点","url":"https://cet4.koolearn.com/20250904/923726.html","zh":"阿房宫(Epang Palace)是秦始皇(the First Emperor of the Qin)击败六国后兴建的新宫殿。据历史记载，阿房宫是一座宏伟辉煌的建筑。根据司马迁的描述，阿房宫建于公元前212年，长693米，宽116.5米。据说在秦朝末年(the last years of the Qin Dynasty)，项羽烧毁了阿房宫。因此，我们今天所能看到的只是它的遗址。阿房宫遗址现位于陕西西安。然而，有专家认为阿房宫并未修建完成，而项羽烧毁的是另一座宫殿。","en":"The Epang Palace was a new palace built by the First Emperor of the Qin after he defeated the other six countries. According to the historical record, the Epang Palace was a grand and glorious building. As described by Sima Qian, the Place was built in 212 BC with 693 meters long and 116.5 meters wide. It is said that in the last years of the Qin Dynasty. Xiang Yu had burst down the Epang Place. So, what we can see today is its ruins, which is now in Xi'an, Shanxi Province. However, some experts hold that the Epang Palace had not been totally completed, and what Xiang Yu had burnt down was another palace.","en2":"","note":"","no":9,"zs":["阿房宫(Epang Palace)是秦始皇(the First Emperor of the Qin)击败六国后兴建的新宫殿。","据历史记载，阿房宫是一座宏伟辉煌的建筑。","根据司马迁的描述，阿房宫建于公元前212年，长693米，宽116.5米。","据说在秦朝末年(the last years of the Qin Dynasty)，项羽烧毁了阿房宫。","因此，我们今天所能看到的只是它的遗址。","阿房宫遗址现位于陕西西安。","然而，有专家认为阿房宫并未修建完成，而项羽烧毁的是另一座宫殿。"],"es":["The Epang Palace was a new palace built by the First Emperor of the Qin after he defeated the other six countries.","According to the historical record, the Epang Palace was a grand and glorious building.","As described by Sima Qian, the Place was built in 212 BC with 693 meters long and 116.5 meters wide.","It is said that in the last years of the Qin Dynasty.","Xiang Yu had burst down the Epang Place.","So, what we can see today is its ruins, which is now in Xi'an, Shanxi Province.","However, some experts hold that the Epang Palace had not been totally completed, and what Xiang Yu had burnt down was another palace."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,5],[4,5,5,6],[5,7,6,7]],"zhLen":234,"enWords":115,"zhSents":7,"enSents":7,"cat":"文旅景点"},{"id":"ko-九寨沟","title":"九寨沟","source":"旅游景点","url":"https://cet4.koolearn.com/20250903/923725.html","zh":"据说如果地球上真有人间仙境，九寨沟(Jiuzhaigou Valley)—定是其中之一。它有梦境般的风景：蓝色的湖泊、瀑布、翠绿的森林、白雪皑皑的山脉，还有藏族和羌族人民(the Tibetan and Qiang peoples)的民间习俗。九寨沟不仅仅有壮观的景色，还是九个藏族村寨的居住地，还有超过220种鸟类以及许多濒临灭绝的动植物物种。它在1992年被联合国教科文组织宣布为世界文化遗产。九寨沟一年四季的美景使它成为中国最著名的景点之一。","en":"It is said that if there should be wonderlands on the earth, Jiuzhaigou Valley must be one of them. It has dreamlike scenery, which combines blue lakes, waterfalls, verdant forests, snow-covered mountains, and the folk customs of the Tibetan and Qiang peoples. More than just spectacular scenery, Jiuzhaigou Valley is home to nine Tibetan villages, over 220 bird species as well as a number of endangered plant and animal species. Jiuzhaigou Valley was declared a UNESCO World Cultural Heritage Site in 1992. It provides spectacular scenery throughout four seasons of the year, making it one of China's most well-known scenic sites.","en2":"","note":"","no":10,"zs":["据说如果地球上真有人间仙境，九寨沟(Jiuzhaigou Valley)—定是其中之一。","它有梦境般的风景：蓝色的湖泊、瀑布、翠绿的森林、白雪皑皑的山脉，还有藏族和羌族人民(the Tibetan and Qiang peoples)的民间习俗。","九寨沟不仅仅有壮观的景色，还是九个藏族村寨的居住地，还有超过220种鸟类以及许多濒临灭绝的动植物物种。","它在1992年被联合国教科文组织宣布为世界文化遗产。","九寨沟一年四季的美景使它成为中国最著名的景点之一。"],"es":["It is said that if there should be wonderlands on the earth, Jiuzhaigou Valley must be one of them.","It has dreamlike scenery, which combines blue lakes, waterfalls, verdant forests, snow-covered mountains, and the folk customs of the Tibetan and Qiang peoples.","More than just spectacular scenery, Jiuzhaigou Valley is home to nine Tibetan villages, over 220 bird species as well as a number of endangered plant and animal species.","Jiuzhaigou Valley was declared a UNESCO World Cultural Heritage Site in 1992.","It provides spectacular scenery throughout four seasons of the year, making it one of China's most well-known scenic sites."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5]],"zhLen":224,"enWords":101,"zhSents":5,"enSents":5,"cat":"文旅景点"},{"id":"ko-长江","title":"长江","source":"2025年6月","url":"https://cet4.koolearn.com/20250409/917154.html","zh":"长江全长6000多米，是中国以及亚洲最长的河流。它发源于青藏高原，流经11个省，往东注入东海。长江流域居住着约4亿人，其中少数民族人口约占6%。从唐朝以来，长江流域一直是中国的经济中心，同时也是中国现代工业的起源地。但是，目前长江流域的经济发展很不平衡，河流三角洲地区发达，而上游区域相对落后。","en":"The Yangtze River, as the longest river in China and Asia, is more than 6,000 meters long. Flowing through 11 provinces, it originates the Qinghai-Tibet Plateau and empties into the East Sea. There are approximately 400 million people living in the Yangtze Basin, among which the ethical minorities account for about 6%. The Yangtze Basin has been the economic center since Tang Dynasty, and was the birthplace of China's modern industry. However, presently the economic development in the basin is imbalanced, generally developed in the Delta region and relatively backward in the upper basin.","en2":"","note":"简要解析】\n第一句：用as…介词短语后置的方式使句子显得更简洁。\n第二句：翻译时注意用非谓语动词作伴随状语;“注入”可译为empty into;“起源于”可译为originate。\n第三句：翻译时可以用there be句型，这样后面可以用定语从句将前后两句连接起来;“长江流域”译为the Yangtze Basin ;“少数民族”译为the ethical minority。\n第四句：翻译时注意使用现在完成时;“起源地”可译为birthplace。\n第五句：翻译时注意省略后面的主谓让整个句子看起来更简洁;“相对落后”可译为relatively backward。","no":11,"zs":["长江全长6000多米，是中国以及亚洲最长的河流。","它发源于青藏高原，流经11个省，往东注入东海。","长江流域居住着约4亿人，其中少数民族人口约占6%。","从唐朝以来，长江流域一直是中国的经济中心，同时也是中国现代工业的起源地。","但是，目前长江流域的经济发展很不平衡，河流三角洲地区发达，而上游区域相对落后。"],"es":["The Yangtze River, as the longest river in China and Asia, is more than 6,000 meters long.","Flowing through 11 provinces, it originates the Qinghai-Tibet Plateau and empties into the East Sea.","There are approximately 400 million people living in the Yangtze Basin, among which the ethical minorities account for about 6%.","The Yangtze Basin has been the economic center since Tang Dynasty, and was the birthplace of China's modern industry.","However, presently the economic development in the basin is imbalanced, generally developed in the Delta region and relatively backward in the upper basin."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,5,3,5]],"zhLen":147,"enWords":94,"zhSents":5,"enSents":5,"cat":"真题"},{"id":"ko-改革开放","title":"改革开放","source":"2025年6月","url":"https://cet4.koolearn.com/20250317/916429.html","zh":"中国特色社会主义社会是一个变革的社会，是一个开放的社会，是一个不断发展和完善的社会。改革开放觉得中国命运的重大决策，要贯穿社会主义发展的过程。只有坚持改革开放，才能不断激发亿万人民的积极性和创造性，解放和发展生产力，永葆社会主义的生机与活力。","en":"The socialism society with Chinese characteristics is a society of refor mi ng, a society of opening-up, a society of continuously developing and improving. The policy of reform and opening-up is a significant decision which determines China's destiny and will be running through the whole process of the socialism development. Only if we adhere to the reform and opening-up policy, can we continuously stimulate the zest and creativity of billions of people, emancipate and develop the productive and keep the vigor and vitality of socialism for good.","en2":"","note":"","no":12,"zs":["中国特色社会主义社会是一个变革的社会，是一个开放的社会，是一个不断发展和完善的社会。","改革开放觉得中国命运的重大决策，要贯穿社会主义发展的过程。","只有坚持改革开放，才能不断激发亿万人民的积极性和创造性，解放和发展生产力，永葆社会主义的生机与活力。"],"es":["The socialism society with Chinese characteristics is a society of refor mi ng, a society of opening-up, a society of continuously developing and improving.","The policy of reform and opening-up is a significant decision which determines China's destiny and will be running through the whole process of the socialism development.","Only if we adhere to the reform and opening-up policy, can we continuously stimulate the zest and creativity of billions of people, emancipate and develop the productive and keep the vigor and vitality of socialism for good."],"p":[[0,2,0,2],[2,3,2,3]],"zhLen":121,"enWords":87,"zhSents":3,"enSents":3,"cat":"真题"},{"id":"ko-银行和邮局工作","title":"银行和邮局工作","source":"2025年6月","url":"https://cet4.koolearn.com/20250317/916430.html","zh":"1948年春，我们从大学毕业，大家纷纷四处求职。很多人奔赴银行，邮局申请工作。那时银行与邮局的职位是金饭碗，工作既稳定，收入又颇丰。","en":"In the spring of 1948, we graduated from universities and started our job-hunting all around. Many people went to banks and post offices to apply for the jobs. At that time, the positions in banks and post offices were well-paid jobs, which were stable and with a high salary.","en2":"","note":"","no":13,"zs":["1948年春，我们从大学毕业，大家纷纷四处求职。","很多人奔赴银行，邮局申请工作。","那时银行与邮局的职位是金饭碗，工作既稳定，收入又颇丰。"],"es":["In the spring of 1948, we graduated from universities and started our job-hunting all around.","Many people went to banks and post offices to apply for the jobs.","At that time, the positions in banks and post offices were well-paid jobs, which were stable and with a high salary."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3]],"zhLen":66,"enWords":49,"zhSents":3,"enSents":3,"cat":"真题"},{"id":"ko-管理部门","title":"管理部门","source":"2025年6月","url":"https://cet4.koolearn.com/20250318/916433.html","zh":"管理部门能够大刀阔斧地进行全面的组织变动，但是你让一个经理把某个人的办公桌从这儿挪到那儿，看他会遇到多么大的困难。一切变革都会遇到抵制，问题是如何使变革尽量大一些，以使它们有获得成功的机会。","en":"Management can make a sweeping organizational change, but just let a manager, try to change someone's desk from here to there, and see the great difficulty he encounters. All change is resisted, so the question is how can the changes be made big enough so that they have a chance of succeeding.","en2":"","note":"","no":14,"zs":["管理部门能够大刀阔斧地进行全面的组织变动，但是你让一个经理把某个人的办公桌从这儿挪到那儿，看他会遇到多么大的困难。","一切变革都会遇到抵制，问题是如何使变革尽量大一些，以使它们有获得成功的机会。"],"es":["Management can make a sweeping organizational change, but just let a manager, try to change someone's desk from here to there, and see the great difficulty he encounters.","All change is resisted, so the question is how can the changes be made big enough so that they have a chance of succeeding."],"p":[[0,1,0,1],[1,2,1,2]],"zhLen":95,"enWords":52,"zhSents":2,"enSents":2,"cat":"真题"},{"id":"ko-中国茶","title":"中国茶","source":"专项(9)","url":"https://cet4.koolearn.com/20260806/935682.html","zh":"中国是茶的故乡。据说早在五六千年前，中国就有了茶树(tea-shrub),而且有关茶树的人类文明可以追溯到两千年前。来自中国的茶和丝绸、瓷器(porcelain)—样，在1000年前为世界所知，而且一直是中国重要的出口产品。目前世界上40多个国家种植茶，其中亚洲国家的产量占世界总产量的90%。其他国家的茶树都直接或间接地起源于中国。","en":"China is the homeland of tea. It is believed that China has tea-shrubs as early as five to six thousand years ago, and human cultivation of tea plants candate back two thousand years. Tea from China, along with her silk and porcelain, began to be known the world over more than a thousand years ago and has since always been an important Chinese export. At present more than forty countries in the world grow tea with Asian countries producing 90% of the world's total output. All tea trees in other countries have their origin directly or indirectly in China.","en2":"","note":"","no":15,"zs":["中国是茶的故乡。","据说早在五六千年前，中国就有了茶树(tea-shrub),而且有关茶树的人类文明可以追溯到两千年前。","来自中国的茶和丝绸、瓷器(porcelain)—样，在1000年前为世界所知，而且一直是中国重要的出口产品。","目前世界上40多个国家种植茶，其中亚洲国家的产量占世界总产量的90%。","其他国家的茶树都直接或间接地起源于中国。"],"es":["China is the homeland of tea.","It is believed that China has tea-shrubs as early as five to six thousand years ago, and human cultivation of tea plants candate back two thousand years.","Tea from China, along with her silk and porcelain, began to be known the world over more than a thousand years ago and has since always been an important Chinese export.","At present more than forty countries in the world grow tea with Asian countries producing 90% of the world's total output.","All tea trees in other countries have their origin directly or indirectly in China."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5]],"zhLen":167,"enWords":99,"zhSents":5,"enSents":5,"cat":"专项练习"},{"id":"ko-七夕节","title":"七夕节","source":"专项(15)","url":"https://cet4.koolearn.com/20260810/935688.html","zh":"自上世纪90年代后期起，七夕节(the Double Seventh Festival)开始被称为“中国的情人节”。这个节日可以追溯到汉朝，当时对恋人、女孩都是个特殊的日子。这天，女孩会举行仪式，向织女(Zhinv)乞求智慧、技艺和美满婚姻，所以七夕节还被称为“乞巧节(the Begging for Skills Festival)”。如今，一些传统习俗已经弱化。人们现在把七夕节当作浪漫的情人节来庆祝，尤其是在年轻人中间。","en":"Double Seventh Festival has been called Chinese Valentine's Day since the late 1990s. The festival can be traced back to the Han Dynasty. It was then a special day not only for lovers, but also for girls. Girls would hold a ceremony to beg Zhinv for wisdom, skills and a satisfying marriage. So it is also called \"the Begging for Skills Festival\". Today some traditional customs have been weakened. Now the festival is celebrated as a romantic valentine's day, particularly among young people.","en2":"","note":"","no":16,"zs":["自上世纪90年代后期起，七夕节(the Double Seventh Festival)开始被称为“中国的情人节”。","这个节日可以追溯到汉朝，当时对恋人、女孩都是个特殊的日子。","这天，女孩会举行仪式，向织女(Zhinv)乞求智慧、技艺和美满婚姻，所以七夕节还被称为“乞巧节(the Begging for Skills Festival)”。","如今，一些传统习俗已经弱化。","人们现在把七夕节当作浪漫的情人节来庆祝，尤其是在年轻人中间。"],"es":["Double Seventh Festival has been called Chinese Valentine's Day since the late 1990s.","The festival can be traced back to the Han Dynasty.","It was then a special day not only for lovers, but also for girls.","Girls would hold a ceremony to beg Zhinv for wisdom, skills and a satisfying marriage.","So it is also called \"the Begging for Skills Festival\".","Today some traditional customs have been weakened.","Now the festival is celebrated as a romantic valentine's day, particularly among young people."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,5],[3,4,5,6],[4,5,6,7]],"zhLen":213,"enWords":83,"zhSents":5,"enSents":7,"cat":"专项练习"},{"id":"ko-中秋节","title":"中秋节","source":"专项(86)","url":"https://cet4.koolearn.com/20260911/935762.html","zh":"农历八月十五日是中国的传统节日——中秋节。在这天，每个家庭都团聚在一起，一家人共同观赏象征丰裕、和谐和好运的圆月。此时，大人们尽情吃着美味的月饼，品着热腾腾的香茗，而孩子们则在一旁拉着明亮的兔子灯尽情玩耍。月宫里美丽的仙女嫦娥的神话故事赋予了这个节日神话色彩。传说古时候，天空曾有10个太阳围着地球旋转。后翌射下了其中9个太阳，拯救了地球上的生灵。他偷了长生不老药，却被妻子嫦娥偷偷喝下，从而产生了嫦娥奔月的故事。","en":"The Mid-Autumn Festival falls on the 15th day of the 8th month of the lunar month. It is a time for family members to congregate and enjoy the full moon, which is a symbol of abundance, harmony and luck. Adults usually indulge in fragrant moon cakes of various kinds with a good cup of hot Chinese tea, while the children run around with their brightly-lit rabbit lanterns. The festival was endowed a mythological flavour with legends of Chang-E, the beautiful lady in the moon. According to Chinese mythology, the earth once had 10 suns circling over it. Hou Yi, shot down 9 of the suns to save all the lives on earth. He stole the elixir of life, which can make people immortal. However, his wife, Chang-E drank it. Thus the legend of Chang-E flying into the moon came into being.","en2":"","note":"","no":17,"zs":["农历八月十五日是中国的传统节日——中秋节。","在这天，每个家庭都团聚在一起，一家人共同观赏象征丰裕、和谐和好运的圆月。","此时，大人们尽情吃着美味的月饼，品着热腾腾的香茗，而孩子们则在一旁拉着明亮的兔子灯尽情玩耍。","月宫里美丽的仙女嫦娥的神话故事赋予了这个节日神话色彩。","传说古时候，天空曾有10个太阳围着地球旋转。","后翌射下了其中9个太阳，拯救了地球上的生灵。","他偷了长生不老药，却被妻子嫦娥偷偷喝下，从而产生了嫦娥奔月的故事。"],"es":["The Mid-Autumn Festival falls on the 15th day of the 8th month of the lunar month.","It is a time for family members to congregate and enjoy the full moon, which is a symbol of abundance, harmony and luck.","Adults usually indulge in fragrant moon cakes of various kinds with a good cup of hot Chinese tea, while the children run around with their brightly-lit rabbit lanterns.","The festival was endowed a mythological flavour with legends of Chang-E, the beautiful lady in the moon.","According to Chinese mythology, the earth once had 10 suns circling over it.","Hou Yi, shot down 9 of the suns to save all the lives on earth.","He stole the elixir of life, which can make people immortal.","However, his wife, Chang-E drank it.","Thus the legend of Chang-E flying into the moon came into being."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5],[5,6,5,6],[6,7,6,9]],"zhLen":207,"enWords":141,"zhSents":7,"enSents":9,"cat":"专项练习"},{"id":"ko-功夫茶","title":"功夫茶","source":"2015年6月","url":"https://cet4.koolearn.com/20150605/793557.html","zh":"功夫茶(Gongfu tea)不是一种茶叶或茶的名字，而是一种冲泡的手艺。人们叫它功夫茶，足因为这种泡茶方式十分讲究：它的操作过程需要一定的技术，以及泡茶和品茶的知识和技能。功夫茶起源于宋朝，在广东的潮州府(今潮汕地区)一带最为盛行，后来在全国各地流行。功夫茶以浓度(concentration)高著称。制作功夫茶主要使用的茶叶足乌龙茶(Oolong tea),因为它能满足功夫茶色、香、味的要求。","en":"Gongfu tea is not one kind of tea or the name of tea, but a skill of making tea. People call it Gongfu tea for the reason of its exquisite process. The operational procedures require certain techniques, knowledge and skill of brewing and tasting tea. Gongfu tea originated in the Song Dynasty and prevailed mostly in Chaozhou Guangdong Province(Now:Chaoshan Area). It later became popular around the nation. Gongfu tea is famous for its high concentration. Oolong tea is mainly used in making the Gongfu tea because it can meet the requirements of color, flavor and taste of the Gongfu tea.","en2":"","note":"","no":18,"zs":["功夫茶(Gongfu tea)不是一种茶叶或茶的名字，而是一种冲泡的手艺。","人们叫它功夫茶，足因为这种泡茶方式十分讲究：它的操作过程需要一定的技术，以及泡茶和品茶的知识和技能。","功夫茶起源于宋朝，在广东的潮州府(今潮汕地区)一带最为盛行，后来在全国各地流行。","功夫茶以浓度(concentration)高著称。","制作功夫茶主要使用的茶叶足乌龙茶(Oolong tea),因为它能满足功夫茶色、香、味的要求。"],"es":["Gongfu tea is not one kind of tea or the name of tea, but a skill of making tea.","People call it Gongfu tea for the reason of its exquisite process.","The operational procedures require certain techniques, knowledge and skill of brewing and tasting tea.","Gongfu tea originated in the Song Dynasty and prevailed mostly in Chaozhou Guangdong Province(Now:Chaoshan Area).","It later became popular around the nation.","Gongfu tea is famous for its high concentration.","Oolong tea is mainly used in making the Gongfu tea because it can meet the requirements of color, flavor and taste of the Gongfu tea."],"p":[[0,1,0,1],[1,2,1,3],[2,3,3,4],[3,4,4,6],[4,5,6,7]],"zhLen":199,"enWords":100,"zhSents":5,"enSents":7,"cat":"真题"},{"id":"ko-吉祥图案","title":"吉祥图案","source":"2015年6月","url":"https://cet4.koolearn.com/20150605/793556.html","zh":"吉祥图案(auspicious patterns)几乎在所有节日或婚礼上都扮演着重要角色。中国的春节、婚礼或其他节日期间，人们喜欢在房间里贴一些吉祥图案，这是表达对幸福生活期望的一种方式。吉祥图案在中国拥有近三千年的历史，至今仍是中国人生活中一个重要的部分。吉祥图案有多种类型且内容广泛，主要表达对象有：福、禄、寿、禧。最流行的图案是双喜(囍)(double happiness)。举行婚礼时人们一般都会用到它。","en":"Auspicious patterns play an important role in almost all the festivals or wedding ceremonies. During the Spring Festival, weddings or other holidays, people like sticking some auspicious patterns in their rooms. It is a way to express the expectation of happy life. The auspicious patterns in China have a long history of nearly three thousand years and are still an important part of Chinese people's life. Auspicious patterns have a variety of types and a wide range of contents, and they mainly express expectation to bless, emolument, longevity and happiness. The most popular patterns are double happiness (two Chinese characters meaning happiness). People generally use it when they hold a wedding.","en2":"","note":"","no":19,"zs":["吉祥图案(auspicious patterns)几乎在所有节日或婚礼上都扮演着重要角色。","中国的春节、婚礼或其他节日期间，人们喜欢在房间里贴一些吉祥图案，这是表达对幸福生活期望的一种方式。","吉祥图案在中国拥有近三千年的历史，至今仍是中国人生活中一个重要的部分。","吉祥图案有多种类型且内容广泛，主要表达对象有：福、禄、寿、禧。","最流行的图案是双喜(囍)(double happiness)。","举行婚礼时人们一般都会用到它。"],"es":["Auspicious patterns play an important role in almost all the festivals or wedding ceremonies.","During the Spring Festival, weddings or other holidays, people like sticking some auspicious patterns in their rooms.","It is a way to express the expectation of happy life.","The auspicious patterns in China have a long history of nearly three thousand years and are still an important part of Chinese people's life.","Auspicious patterns have a variety of types and a wide range of contents, and they mainly express expectation to bless, emolument, longevity and happiness.","The most popular patterns are double happiness (two Chinese characters meaning happiness).","People generally use it when they hold a wedding."],"p":[[0,1,0,1],[1,3,1,4],[3,4,4,5],[4,5,5,6],[5,6,6,7]],"zhLen":206,"enWords":111,"zhSents":6,"enSents":7,"cat":"真题"},{"id":"ko-希望工程","title":"希望工程","source":"2015年6月","url":"https://cet4.koolearn.com/20150605/793555.html","zh":"自1983年，希望工程(Project Hope)已经解决了国家的一些最紧迫的问题。这些问题包括儿童心脏缺陷、糖尿病(diabetes)、艾滋病和护士教育，其短期的目标是在一些贫困县建立补助金项目，长期目标集中在确保所有中国孩子享受受教育的基本权利。目前希望工程在中国开展了若干个项目，包括肿瘤学(oncology)培训、农村卫生保健提供者教育、儿童营养计划、护士培训等。","en":"Project Hope has addressed some of the country's most pressing issues since 1983. These issues include children's heart defects, diabetes, AIDS and nurse education. Its short-term goal is to establish grant-in-aid programs in some poverty-stricken counties, while the long-term target center on ensuring that all the Chinese children enjoy the basic right of accepting their education. Currently, Project Hope has operates several programs in China, including oncology training, education for rural health care providers, children's nutrition program, nurse training and so on.","en2":"","note":"","no":20,"zs":["自1983年，希望工程(Project Hope)已经解决了国家的一些最紧迫的问题。","这些问题包括儿童心脏缺陷、糖尿病(diabetes)、艾滋病和护士教育，其短期的目标是在一些贫困县建立补助金项目，长期目标集中在确保所有中国孩子享受受教育的基本权利。","目前希望工程在中国开展了若干个项目，包括肿瘤学(oncology)培训、农村卫生保健提供者教育、儿童营养计划、护士培训等。"],"es":["Project Hope has addressed some of the country's most pressing issues since 1983.","These issues include children's heart defects, diabetes, AIDS and nurse education.","Its short-term goal is to establish grant-in-aid programs in some poverty-stricken counties, while the long-term target center on ensuring that all the Chinese children enjoy the basic right of accepting their education.","Currently, Project Hope has operates several programs in China, including oncology training, education for rural health care providers, children's nutrition program, nurse training and so on."],"p":[[0,1,0,1],[1,2,1,3],[2,3,3,4]],"zhLen":186,"enWords":82,"zhSents":3,"enSents":4,"cat":"真题"},{"id":"ko-秦始皇陵墓","title":"秦始皇陵墓","source":"文旅景点","url":"https://cet4.koolearn.com/20261022/941245.html","zh":"秦始皇陵墓(the Mausoleum of the Emperor Qin Shihuang)坐落在陕西省西安市临潼区以东5公里的骊山北部，是中国历史上第一个皇帝的最终休眠之地。它于公元前246年开始建造，工程持续了38年。它占地面积56.25平方公里，是中国历史上最大的陵墓。","en":"The Mausoleum of the Emperor Qin Shihuang, located at the northern foot of the Lishan Mountain five kilometers east of Lintong District, Xi'an City, Shanxi Province, is the final resting place of the first emperor in the history of China. Its construction lasted for 38 years, commencing in 246BC. With an area of 56.25 square kilometers, it's the largest mausoleum in China's history.","en2":"","note":"","no":21,"zs":["秦始皇陵墓(the Mausoleum of the Emperor Qin Shihuang)坐落在陕西省西安市临潼区以东5公里的骊山北部，是中国历史上第一个皇帝的最终休眠之地。","它于公元前246年开始建造，工程持续了38年。","它占地面积56.25平方公里，是中国历史上最大的陵墓。"],"es":["The Mausoleum of the Emperor Qin Shihuang, located at the northern foot of the Lishan Mountain five kilometers east of Lintong District, Xi'an City, Shanxi Province, is the final resting place of the first emperor in the history of China.","Its construction lasted for 38 years, commencing in 246BC.","With an area of 56.25 square kilometers, it's the largest mausoleum in China's history."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3]],"zhLen":140,"enWords":63,"zhSents":3,"enSents":3,"cat":"文旅景点"},{"id":"xdf-2025-6-一","title":"袁隆平杂交水稻","source":"2025年6月 真题","url":"https://cet4-6.xdf.cn/202605/15203263.html","zh":"被誉为“杂交水稻之父”的袁隆平和他的科研团队克服重重困难，研发出了一种超级杂交水稻。这项技术获得了举世公认的巨大成功。通过这项技术的应用，水稻抗旱抗病能力更强，能适应不同的气候和土壤条件，产量可提高20%-30%。超级杂交水稻营养丰富，口感更佳。目前，这项技术已经在许多国家得到广泛应用，为全球粮食安全做出了重大贡献。","en":"Yuan Longping, known as the\"Father of Hybrid Rice,\" and his research team overcame numerous difficulties to develop a super hybrid rice. This technology has achieved globally recognized great success. Through the application of this technology, rice has stronger drought and disease resistance, can adapt to different climatic and soil conditions, and its yield can be increased by 20% to 30%. Super hybrid rice is rich in nutrition and has a better taste. At present, this technology has been widely applied in many countries, making significant contributions to global food security.","en2":"","note":"逐句解析：\n第一句“被誉为...研发出...”：中文两个短句，英译时用“known as”处理“被誉为”，用“to develop”不定式表示目的。\n第二句“获得了...成功”：“globally recognized”作定语修饰“success”，语序要注意。\n第三句“通过...应用...”：“through the application of”是四级高频短语；“抗旱抗病能力更强”译为比较级“stronger...”，注意并列结构的处理。\n第四句“营养丰富，口感更佳”：“rich in nutrition”和“has a better taste”两个短句用and连接。\n第五句“为...做出贡献”：“making significant contributions to”是现在分词作结果状语，推荐掌握这个句型。","no":22,"zs":["被誉为“杂交水稻之父”的袁隆平和他的科研团队克服重重困难，研发出了一种超级杂交水稻。","这项技术获得了举世公认的巨大成功。","通过这项技术的应用，水稻抗旱抗病能力更强，能适应不同的气候和土壤条件，产量可提高20%-30%。","超级杂交水稻营养丰富，口感更佳。","目前，这项技术已经在许多国家得到广泛应用，为全球粮食安全做出了重大贡献。"],"es":["Yuan Longping, known as the\"Father of Hybrid Rice,\" and his research team overcame numerous difficulties to develop a super hybrid rice.","This technology has achieved globally recognized great success.","Through the application of this technology, rice has stronger drought and disease resistance, can adapt to different climatic and soil conditions, and its yield can be increased by 20% to 30%.","Super hybrid rice is rich in nutrition and has a better taste.","At present, this technology has been widely applied in many countries, making significant contributions to global food security."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4],[4,5,4,5]],"zhLen":159,"enWords":90,"zhSents":5,"enSents":5,"cat":"真题"},{"id":"xdf-2025-6-set2","title":"东北冰雪经济","source":"2025年6月 真题 第2套","url":"https://cet4-6.xdf.cn/202512/15046300.html","zh":"近年来，中国东北地区正在大力发展冰雪资源，例如哈尔滨利用丰富的冰雪资源，打造了独具特色的冰雪大世界，让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化。如今，曾经令人畏惧的冰天雪地正吸引着四面八方的游客，成为了深受欢迎的旅游胜地，冰雪资源也为当地的经济发展做出越来越大的贡献。","en":"In recent years, northeast China has been vigorously developing ice-snow resources. For example, Harbin has built the unique Ice and Snow World by using its rich ice-snow resources, allowing tourists to appreciate the beauty of ice and snow while experiencing the local unique folk culture. Nowadays, the once daunting ice and snow are attracting tourists from all directions, becoming a popular tourist destination. Ice-snow resources are also making greater contributions to the local economic development.​","en2":"In recent years, northeast China has been vigorously advancing the development of its ice and snow resources. For instance, Harbin has leveraged its abundant ice and snow resources to create the regionally distinctive\"Ice and Snow World\", enabling visitors to feast their eyes on the glamour of ice and snow and immerse themselves in the area's unique folk culture simultaneously. Nowadays, the once-feared icy and snowy landscapes are drawing tourists from near and far, evolving into a much-loved tourist attraction, and ice and snow resources are making an increasingly significant contribution to the local economic growth.​","note":"逐句考点与难点解析​\n（一）第一句：近年来，中国东北地区正在大力发展冰雪资源​\n时态考点​\n句中 “近年来”+“正在” 的组合，需使用现在完成进行时（has/have been doing），强调动作从过去持续到现在且仍在进行，这是本句核心语法考点，若误用现在进行时（is developing）或现在完成时（has developed）会导致时态扣分。​\n核心词汇​\n“东北地区”：固定表达为 “northeast China”，无需直译 “region”，避免写成 “the northeast region of China” 的冗余表达；​\n“大力发展”：基础译法 “vigorously develop”，进阶译法可使用 “vigorously advance the development of”“energetically promote”；​\n“冰雪资源”：“ice-snow resources” 为行业通用表达，也可写作 “ice and snow resources”。​\n（二）第二句：例如哈尔滨利用丰富的冰雪资源，打造了独具特色的冰雪大世界，让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化​\n句式结构​\n本句包含多个动作逻辑，“利用资源”“打造景点”“让游客体验” 为递进关系，可采用 “主句 + 非谓语动词” 结构（allowing...）实现句式紧凑，也可拆分短句，但会降低表达流畅度。​\n核心表达​\n“利用”：基础译法 “use”，译法 “leverage”“utilize”“make use of”；​\n“独具特色的冰雪大世界”：专有名词 “冰雪大世界” 固定译法 “Ice and Snow World”，“独具特色” 可译为 “unique”“regionally distinctive”“with distinctive local features”；​\n“在…… 同时”：除 “while” 引导时间状语从句外，还可使用 “and...simultaneously”“as well as” 等结构，注意从句中主语需与主句一致（均为 tourists）；​\n“民俗文化”：固定表达 “folk culture”，避免错译为 “custom culture”。​\n（三）第三句：如今，曾经令人畏惧的冰天雪地正吸引着四面八方的游客，成为了深受欢迎的旅游胜地​\n词汇与搭配​\n“令人畏惧的”：基础译法 “daunting”，替代表达 “frightening”“intimidating”“feared”；​\n“四面八方的游客”：“tourists from all directions” 为基础表达，进阶译法 “tourists from near and far”“visitors from every corner of the country” 更具画面感；​\n“旅游胜地”：常用 “tourist destination”“tourist attraction”，注意 “resort” 多指度假胜地，此处不适用。​\n语法结构​\n“成为了……” 用现在分词 “becoming” 作结果状语，体现动作的自然结果，若误用定语从句（which becomes...）会弱化逻辑关联。​\n（四）第四句：冰雪资源也为当地的经济发展做出越来越大的贡献​\n固定搭配​\n“为…… 做出贡献”：核心搭配 “make contributions to”，“贡献” 需用复数形式，也可使用 “contribute to”（动词短语）；​\n“越来越大的”：基础译法 “greater”，进阶译法 “increasingly significant”“growing”，注意 “more and more big” 为典型中式表达，需规避。​\n四、考生常见错误总结​\n时态错误​\n多数考生将 “正在大力发展” 误译为 “is vigorously developing”，忽略 “近年来” 要求的完成时态，未使用现在完成进行时，导致语法扣分。​\n专有名词翻译不规范​\n把 “冰雪大世界” 直译为 “Snow and Ice World”（大小写错误）或 “Ice and Snow Theme Park”（过度解读），未使用官方固定译法。​\n句式杂糅​\n部分考生将第二句拆分为多个简单句（“Harbin uses resources. It builds Ice and Snow World. Tourists can enjoy the beauty.”），破坏了句子间的逻辑连贯性，且增加冗余主语。​\n词汇搭配错误​\n出现 “do contributions to”“develop economic” 等搭配错误，或用 “ice and snow sky and land” 直译 “冰天雪地”，造成语义不通。​\n五、主题与备考启示 ​\n主题趋势​\n本次翻译聚焦 “中国特色文旅产业”，延续了四级翻译 “中国文化 / 社会发展” 的核心命题方向，与近年 “传统节日”“非遗文化”“区域经济” 等主题一脉相承。​\n备考建议​\n积累主题词汇：重点记忆 “文旅产业”“冰雪经济”“民俗文化” 等相关表达，如 “ice-snow tourism”（冰雪旅游）、“local folklore”（当地民俗）；​\n强化时态逻辑：针对 “近年来”“自…… 以来”“一直” 等时间标志词，专项练习现在完成时 / 现在完成进行时的用法；​\n优化句式结构：多练习 “主句 + 非谓语”“状语从句简化” 等句式，避免通篇简单句；​\n规范专有名词：整理中国特色景点、节日、文化概念的官方译法，如 “故宫（the Palace Museum）”“端午节（the Dragon Boat Festival）” 等，杜绝直译。\n版权及免责声明\n① 凡本网注明\"稿件来源：新东方\"的所有图文、音视频等内容，版权均属新东方教育科技集团（含本网和新东方网）所有，未经本网协议授权不得转载、链接、转贴或以其他任何方式复制、发表。经授权使用时必须注明\"稿件来源：新东方\"，违者本网将依法追究法律责任。\n② 本网未注明\"稿件来源：新东方\"的内容均为转载稿，本网转载仅基于信息传递之目的，并不表示认同其观点或证实其真实性。如拟从本网转载使用，必须保留本网注明的\"稿件来源\"，并自负版权等法律责任。如擅自篡改为\"稿件来源：新东方\"，本网将依法追究法律责任。\n③ 如本网转载稿涉及版权等问题，请作者见稿后在两周内速与新东方网联系，邮箱：adm@xdf.cn。\n热门推荐\n更多\n相关文章\n更多\n关于新东方\n营业执照\n法律声明\n隐私协议\n社会责任\n投资者关系\n最新资讯\n国际教育\n留学申请\n考研\n四六级\n专升本\n小语种\n信息查询\n校区和报名点\n教师信息\n学习工具\n新东方云教室\n新东方APP\n新东方乐词APP\n加入我们\n新东方招聘\n社会招聘\n校园招聘\n新东方公众号\n新东方抖音直播间\n-->\n经营许可证编号： 京ICP备05067667号-32 | 京ICP证060601号 |\n京公网安备11010802021790号\nCopyright 2011- 新东方教育科技集团有限公司, All Rights","no":23,"zs":["近年来，中国东北地区正在大力发展冰雪资源，例如哈尔滨利用丰富的冰雪资源，打造了独具特色的冰雪大世界，让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化。","如今，曾经令人畏惧的冰天雪地正吸引着四面八方的游客，成为了深受欢迎的旅游胜地，冰雪资源也为当地的经济发展做出越来越大的贡献。"],"es":["In recent years, northeast China has been vigorously developing ice-snow resources.","For example, Harbin has built the unique Ice and Snow World by using its rich ice-snow resources, allowing tourists to appreciate the beauty of ice and snow while experiencing the local unique folk culture.","Nowadays, the once daunting ice and snow are attracting tourists from all directions, becoming a popular tourist destination.","Ice-snow resources are also making greater contributions to the local economic development.​"],"p":[[0,1,0,2],[1,2,2,4]],"zhLen":139,"enWords":75,"zhSents":2,"enSents":4,"cat":"真题"},{"id":"xdf-2025-6-三","title":"15分钟便民生活圈","source":"2025年6月 真题","url":"https://cet4-6.xdf.cn/202605/15203263.html","zh":"近年来，中国越来越多的城市致力打造“15分钟便民生活圈”。生活在便民生活圈里的居民可以在15分钟步行范围内获得公共服务。便民生活圈配备便利店、公园、健身设施、图书馆、学校、社区食堂和诊所等。建立这样的生活圈有助于为居民提供更便捷、舒适、友好和宜人的生活环境，更好地满足多样化的城市居民需求，提高居民生活质量和幸福感。","en":"In recent years, more and more cities in China have been committed to building \"15-minute convenient living circles\". Residents living in these circles can access public services within a 15-minute walking distance. Such living circles are equipped with convenience stores, parks, fitness facilities, libraries, schools, community canteens, clinics and so on. Establishing these circles helps provide residents with a more convenient, comfortable, friendly and pleasant living environment, better meet the diverse needs of urban residents, and improve their quality of life and happiness.","en2":"","note":"逐句解析：\n第一句“致力打造”：“have been committed to building”，be committed to doing sth.是固定搭配。\n第二句“15分钟步行范围内”：“within a 15-minute walking distance”，注意“步行距离”的表达。\n第三句“配备...”：“are equipped with...”，被动语态，注意列举时的平行结构。\n第四句“有助于...”：“helps (to) do sth.”，后面用动词原形；三个并列动词“provide...meet...improve...”保持平行结构。\n四级翻译核心技巧\n一、时态判断三原则\n描述过去成就（如“研发出了”）要用一般过去时。描述持续发展（如“近年来...正在发展”）要用现在完成进行时。描述客观事实（如“水稻抗旱能力强”）要用一般现在时。\n二、三大加分句型\n“被誉为”可以用known as或regarded as来表达。“通过...”可以用through或by doing来表达。“为...做出贡献”可以用make contributions to或contribute to来表达。\n三、高频短语速记\n克服困难对应overcome difficulties。取得成就对应achieve success。被广泛应用对应be widely applied。适应条件对应adapt to conditions。配备设备对应be equipped with。满足需求对应meet needs。\n四、考场时间分配建议\n审题断句控制在3分钟左右，逐句翻译控制在15分钟左右，最后的检查修改留出2分钟。\n想获取更多四六级备考干货、最新的考情解析以及高效的解题技巧吗？欢迎持续关注新东方四六级网（网址：https://cet4-6.xdf.cn）。这里汇聚了海量学习资源与备考指导，是你达成学业目标的坚实后盾。\n版权及免责声明\n① 凡本网注明\"稿件来源：新东方\"的所有图文、音视频等内容，版权均属新东方教育科技集团（含本网和新东方网）所有，未经本网协议授权不得转载、链接、转贴或以其他任何方式复制、发表。经授权使用时必须注明\"稿件来源：新东方\"，违者本网将依法追究法律责任。\n② 本网未注明\"稿件来源：新东方\"的内容均为转载稿，本网转载仅基于信息传递之目的，并不表示认同其观点或证实其真实性。如拟从本网转载使用，必须保留本网注明的\"稿件来源\"，并自负版权等法律责任。如擅自篡改为\"稿件来源：新东方\"，本网将依法追究法律责任。\n③ 如本网转载稿涉及版权等问题，请作者见稿后在两周内速与新东方网联系，邮箱：adm@xdf.cn。\n热门推荐\n更多\n相关文章\n更多\n关于新东方\n营业执照\n法律声明\n隐私协议\n社会责任\n投资者关系\n最新资讯\n国际教育\n留学申请\n考研\n四六级\n专升本\n小语种\n信息查询\n校区和报名点\n教师信息\n学习工具\n新东方云教室\n新东方APP\n新东方乐词APP\n加入我们\n新东方招聘\n社会招聘\n校园招聘\n新东方公众号\n新东方抖音直播间\n-->\n经营许可证编号： 京ICP备05067667号-32 | 京ICP证060601号 |\n京公网安备11010802021790号\nCopyright 2011- 新东方教育科技集团有限公司, All Rights Reserved\n公司总部地址：北京市海淀区海淀中街6号","no":24,"zs":["近年来，中国越来越多的城市致力打造“15分钟便民生活圈”。","生活在便民生活圈里的居民可以在15分钟步行范围内获得公共服务。","便民生活圈配备便利店、公园、健身设施、图书馆、学校、社区食堂和诊所等。","建立这样的生活圈有助于为居民提供更便捷、舒适、友好和宜人的生活环境，更好地满足多样化的城市居民需求，提高居民生活质量和幸福感。"],"es":["In recent years, more and more cities in China have been committed to building \"15-minute convenient living circles\".","Residents living in these circles can access public services within a 15-minute walking distance.","Such living circles are equipped with convenience stores, parks, fitness facilities, libraries, schools, community canteens, clinics and so on.","Establishing these circles helps provide residents with a more convenient, comfortable, friendly and pleasant living environment, better meet the diverse needs of urban residents, and improve their quality of life and happiness."],"p":[[0,1,0,1],[1,2,1,2],[2,3,2,3],[3,4,3,4]],"zhLen":158,"enWords":83,"zhSents":4,"enSents":4,"cat":"真题"},{"id":"xdf-2022-6-1","title":"寓言故事 1","source":"2022年6月 真题","url":"https://cet4-6.xdf.cn/202206/11919774.html","zh":"从前有个农夫嫌他种的禾苗长得慢，就到地里把禾苗一株株地拔高了一点。回家后他对家人说：“今天可真把我累坏了！但我总算让禾苗一下子长高了。”儿子到地里去一看，禾苗都已经死光了。现在有些家长急于让孩子成功，往往步那个农夫的后尘，搞得孩子苦不堪言，却不见孩子学业长进。这样的家长是否该对这个问题有所醒悟，让孩子自然成长呢？","en":"Once upon a time a farmer who felt unhappy with the slow growth of the seedlings went to the field and pulled them up a bit one by one. Returning home he told his family,\"am exhausted today! However I finally made those seedlings grow taller all at once.\" His son hurried to the field only to find that the seedlings had died out. Nowadays, some parents are so eager for their children's success that they will repeat the tragedy of the farmer, making their kids suffer greatly and meanwhile seeing no progress of them. Should such parents wake up to this reality and give their children space for natural growth?","en2":"","note":"","no":25,"zs":["从前有个农夫嫌他种的禾苗长得慢，就到地里把禾苗一株株地拔高了一点。","回家后他对家人说：“今天可真把我累坏了！","但我总算让禾苗一下子长高了。","”儿子到地里去一看，禾苗都已经死光了。","现在有些家长急于让孩子成功，往往步那个农夫的后尘，搞得孩子苦不堪言，却不见孩子学业长进。","这样的家长是否该对这个问题有所醒悟，让孩子自然成长呢？"],"es":["Once upon a time a farmer who felt unhappy with the slow growth of the seedlings went to the field and pulled them up a bit one by one.","Returning home he told his family,\"am exhausted today!","However I finally made those seedlings grow taller all at once.\" His son hurried to the field only to find that the seedlings had died out.","Nowadays, some parents are so eager for their children's success that they will repeat the tragedy of the farmer, making their kids suffer greatly and meanwhile seeing no progress of them.","Should such parents wake up to this reality and give their children space for natural growth?"],"p":[[0,1,0,1],[1,2,1,2],[2,4,2,3],[4,5,3,4],[5,6,4,5]],"zhLen":157,"enWords":110,"zhSents":6,"enSents":5,"cat":"真题"},{"id":"xdf-2022-6-2","title":"寓言故事 2","source":"2022年6月 真题","url":"https://cet4-6.xdf.cn/202206/11919774.html","zh":"从前有个人养了一群羊，一天早上他准备出去放羊，发现少了一只。他仔细一看，看到羊栏(sheepfold)上有个窟窿。显然夜间有狼钻进羊圈叼走了羊。邻居劝他修羊栏，可是他不听。第二天他发现狼又通过窟窿叼走一只羊。他想起邻居的话，就赶快堵上窟窿，把羊栏补好。此后，他的羊再也没有被狼叼走。故事告诉我们：出了问题及时补救，可以防止蒙受更大损失。","en":"Once upon a time, a man, who kept a flock of sheep, was ready to herd them when he noticed one of them was gone. Observing carefully, he saw a hole in the sheepfold. Obviously, a wolf must have got in and taken the sheep away. His neighbour advised him to fix the sheepfold, but he wouldn't listen only to find the next day that another sheep was carried away by the wolf. Remembering his neighbour's words, he hurried to repair the sheepfold by plugging the hole. Since then, no sheep was missing in this way ever again. The story tells us: if we solve the problem in time, we can prevent ourselves from suffering bigger loss.","en2":"","note":"","no":26,"zs":["从前有个人养了一群羊，一天早上他准备出去放羊，发现少了一只。","他仔细一看，看到羊栏(sheepfold)上有个窟窿。","显然夜间有狼钻进羊圈叼走了羊。","邻居劝他修羊栏，可是他不听。","第二天他发现狼又通过窟窿叼走一只羊。","他想起邻居的话，就赶快堵上窟窿，把羊栏补好。","此后，他的羊再也没有被狼叼走。","故事告诉我们：出了问题及时补救，可以防止蒙受更大损失。"],"es":["Once upon a time, a man, who kept a flock of sheep, was ready to herd them when he noticed one of them was gone.","Observing carefully, he saw a hole in the sheepfold.","Obviously, a wolf must have got in and taken the sheep away.","His neighbour advised him to fix the sheepfold, but he wouldn't listen only to find the next day that another sheep was carried away by the wolf.","Remembering his neighbour's words, he hurried to repair the sheepfold by plugging the hole.","Since then, no sheep was missing in this way ever again.","The story tells us: if we solve the problem in time, we can prevent ourselves from suffering bigger loss."],"p":[[0,1,0,1],[1,2,1,3],[2,5,3,4],[5,6,4,5],[6,7,5,6],[7,8,6,7]],"zhLen":168,"enWords":117,"zhSents":8,"enSents":7,"cat":"真题"},{"id":"xdf-2022-6-3","title":"寓言故事 3","source":"2022年6月 真题","url":"https://cet4-6.xdf.cn/202206/11919774.html","zh":"从前，有个农夫正在地里耕作，突然看见一只兔子飞奔而过，撞在一棵大树上死了。农夫毫不费力就吃到了兔肉，心里非常高兴。他想，\"如果总是这样该多好啊！\"于是，不再耕作，每天守候在那棵树旁，等待着能再捡到撞死在树上的兔子。他等呀等，等了一天又一天，田地也荒芜了，却再也没有等到第二只兔子。人们因而都嘲笑他把偶然当成必然。","en":"Once upon a time, a farmer, who was working in the field, suddenly saw a hare running past, hitting a large tree and killing itself. He was so pleased to eat its meat easily that he thought, \"What a wonderful thing to have this all the time!\" From then on, he stopped working and waited by the tree for more hares that would crash. He waited and waited one day after another, in vain, only to have a deserted field. Therefore, people laughed at him for taking the accidental for the inevitable.","en2":"","note":"","no":27,"zs":["从前，有个农夫正在地里耕作，突然看见一只兔子飞奔而过，撞在一棵大树上死了。","农夫毫不费力就吃到了兔肉，心里非常高兴。","他想，\"如果总是这样该多好啊！","\"于是，不再耕作，每天守候在那棵树旁，等待着能再捡到撞死在树上的兔子。","他等呀等，等了一天又一天，田地也荒芜了，却再也没有等到第二只兔子。","人们因而都嘲笑他把偶然当成必然。"],"es":["Once upon a time, a farmer, who was working in the field, suddenly saw a hare running past, hitting a large tree and killing itself.","He was so pleased to eat its meat easily that he thought, \"What a wonderful thing to have this all the time!\" From then on, he stopped working and waited by the tree for more hares that would crash.","He waited and waited one day after another, in vain, only to have a deserted field.","Therefore, people laughed at him for taking the accidental for the inevitable."],"p":[[0,1,0,1],[1,4,1,2],[4,6,2,4]],"zhLen":156,"enWords":92,"zhSents":6,"enSents":4,"cat":"真题"}];

   状态 + 存储（file:// 下 localStorage 会抛 SecurityError ⇒ 全 try/catch）
   ============================================================ */
const S = {view:"list", idx:-1, showEn:false, showPair:false, hideHint:false, t:0, timer:null};
function load(k, d){ try{ const v=localStorage.getItem("fanyi."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function save(k, v){ try{ localStorage.setItem("fanyi."+k, JSON.stringify(v)); }catch(e){} }

/* ============================================================
   工具
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function $(id){ return document.getElementById(id); }

/* 中文里的英文提示：(Gongfu tea) ⇒ 可挖空 */
function zhHtml(s, hide){
  return esc(s).replace(/\(([^)]{1,60})\)/g, (m, inner) =>
    hide ? '<span class="blank">（&nbsp;&nbsp;&nbsp;&nbsp;）</span>'
         : '<span class="hint">（' + inner + '）</span>');
}

/* ============================================================
   目录
   ============================================================ */
function catOf(x){
  const s = x.source + " " + x.title;
  if (s.indexOf("真题") >= 0 || /\d{4}年\d{1,2}月/.test(x.source)) return "真题";
  if (s.indexOf("文旅") >= 0 || s.indexOf("景点") >= 0) return "文旅景点";
  if (s.indexOf("专项") >= 0) return "专项练习";
  return "其他训练";
}
function renderList(){
  const done = load("done", []);
  const cats = [];
  DATA.forEach((x, i) => {
    const c = catOf(x);
    let g = cats.filter(g => g.name === c)[0];
    if (!g){ g = {name:c, items:[]}; cats.push(g); }
    g.items.push(i);
  });
  const order = ["真题","专项练习","文旅景点","其他训练"];
  cats.sort((a,b) => order.indexOf(a.name) - order.indexOf(b.name));
  let h = "";
  h += '<div class="top"><div class="top-in">'
     + '<h1>四级翻译练习</h1>'
     + '<button class="btn" id="fs">字号 ' + (load("fs",30)) + '</button>'
     + '<button class="btn" id="hc">高对比</button>'
     + '</div></div>';
  h += '<div class="wrap">';
  h += '<div class="meta">共 ' + DATA.length + ' 套 · 点标题开始练习 · 参考译文默认收起，先做后看</div>';
  cats.forEach(g => {
    h += '<div class="cat">' + g.name + '（' + g.items.length + ' 套）</div><div class="items">';
    g.items.forEach(i => {
      const x = DATA[i];
      h += '<button class="item' + (done.indexOf(x.id) >= 0 ? ' done' : '') + '" data-i="' + i + '">'
         + '<b>' + esc(x.title) + '</b>'
         + '<span>' + esc(x.source) + ' · 中文 ' + x.zhLen + ' 字 · 英文 ' + x.enWords + ' 词</span>'
         + '</button>';
    });
    h += '</div>';
  });
  h += '<div class="foot">材料来自公开的四级翻译练习页与真题解析页，仅供课堂练习使用。'
     + '参考译文与原文可能有出入，讲评时请以实际评分标准为准。</div>';
  h += '</div>';
  $("app").innerHTML = h;

  $("app").querySelectorAll(".item").forEach(b => {
    b.addEventListener("click", () => { S.idx = +b.dataset.i; S.showEn=false; S.showPair=false; S.t=0; stopTimer(); render(); window.scrollTo(0,0); });
  });
  $("fs").addEventListener("click", () => {
    const sizes=[28,30,32,34,36], cur=load("fs",30);
    const next=sizes[(sizes.indexOf(cur)+1)%sizes.length];
    save("fs",next); applyFs(); $("fs").textContent="字号 "+next;
  });
  $("hc").addEventListener("click", () => {
    const on=document.documentElement.classList.toggle("hc"); save("hc",on);
  });
}

/* ============================================================
   练习页
   ============================================================ */
function fmt(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function stopTimer(){ if(S.timer){clearInterval(S.timer); S.timer=null;} }
function startTimer(){ stopTimer(); S.t=0; S.timer=setInterval(()=>{ S.t++; const el=$("tm"); if(el) el.textContent=fmt(S.t); },1000); }

function render(){
  const x = DATA[S.idx];
  if (!x){ renderList(); return; }
  const done = load("done", []);
  let h = "";
  h += '<div class="top"><div class="top-in">'
     + '<button class="btn" id="back">← 目录</button>'
     + '<span class="timer" id="tm">' + fmt(S.t) + '</span>'
     + '<button class="btn" id="fs">字号 ' + load("fs",30) + '</button>'
     + '<button class="btn" id="hc">高对比</button>'
     + '</div></div>';
  h += '<div class="wrap">';
  h += '<div class="meta">' + esc(x.source) + ' · 中文 ' + x.zhLen + ' 字 · 英文 ' + x.enWords + ' 词'
     + (x.en2 ? ' · 含两种参考译文' : '') + '</div>';
  h += '<div class="q"><div class="zh">' + x.zs.map(s => '<p style="margin:0 0 10px">' + zhHtml(s, S.hideHint) + '</p>').join('') + '</div></div>';

  h += '<div class="ops">'
     + '<button class="btn' + (S.showEn?' on':'') + '" id="tEn">' + (S.showEn?'隐藏参考译文':'显示参考译文') + '</button>'
     + '<button class="btn' + (S.showPair?' on':'') + '" id="tPair">' + (S.showPair?'收起逐句对照':'逐句对照') + '</button>'
     + '<button class="btn' + (S.hideHint?' on':'') + '" id="tHint">' + (S.hideHint?'显示英文提示':'隐藏英文提示') + '</button>'
     + '<button class="btn" id="tTimer">' + (S.timer?'暂停计时':'开始计时') + '</button>'
     + '</div>';

  if (S.showEn){
    h += '<div class="en">' + x.es.map(s => '<p class="sent">' + esc(s) + '</p>').join('') + '</div>';
    if (x.en2){
      h += '<div class="en en2"><div class="meta" style="padding:0 0 8px">进阶版参考译文</div>'
         + x.en2.split(/(?<=[.!?])\s+/).map(s => '<p class="sent">' + esc(s) + '</p>').join('') + '</div>';
    }
  }
  if (S.showPair){
    h += '<div class="en"><div class="meta" style="padding:0 0 6px">逐句对照（中 ← → 英）</div>';
    x.p.forEach((p, i) => {
      const zh = x.zs.slice(p[0], p[1]).join("");
      const en = x.es.slice(p[2], p[3]).join(" ");
      h += '<div class="pair"><div class="no">' + (i+1) + '</div>'
         + '<div class="pzh">' + zhHtml(zh, S.hideHint) + '</div>'
         + '<div class="pen">' + esc(en) + '</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="nav">'
     + '<button class="btn" id="prev"' + (S.idx<=0?' disabled':'') + '>← 上一套</button>'
     + '<button class="btn" id="next"' + (S.idx>=DATA.length-1?' disabled':'') + '>下一套 →</button>'
     + '</div>';
  h += '<div class="foot">第 ' + (S.idx+1) + ' / ' + DATA.length + ' 套 · '
     + '<a href="#" id="src">材料出处</a></div>';
  h += '</div>';
  $("app").innerHTML = h;

  $("back").addEventListener("click", () => { stopTimer(); S.view="list"; renderList(); window.scrollTo(0,0); });
  $("tEn").addEventListener("click", () => { S.showEn=!S.showEn; if(S.showEn) markDone(x); render(); });
  $("tPair").addEventListener("click", () => { S.showPair=!S.showPair; if(S.showPair) markDone(x); render(); });
  $("tHint").addEventListener("click", () => { S.hideHint=!S.hideHint; render(); });
  $("tTimer").addEventListener("click", () => { if(S.timer){stopTimer();} else {startTimer();} render(); });
  $("prev").addEventListener("click", () => { if(S.idx>0){S.idx--;S.t=0;stopTimer();render();window.scrollTo(0,0);} });
  $("next").addEventListener("click", () => { if(S.idx<DATA.length-1){S.idx++;S.t=0;stopTimer();render();window.scrollTo(0,0);} });
  $("fs").addEventListener("click", () => {
    const sizes=[28,30,32,34,36], cur=load("fs",30);
    const next=sizes[(sizes.indexOf(cur)+1)%sizes.length];
    save("fs",next); applyFs(); $("fs").textContent="字号 "+next;
  });
  $("hc").addEventListener("click", () => { const on=document.documentElement.classList.toggle("hc"); save("hc",on); });
  $("src").addEventListener("click", ev => { ev.preventDefault(); window.open(x.url, "_blank"); });
}
function markDone(x){
  const done = load("done", []);
  if (done.indexOf(x.id) < 0){ done.push(x.id); save("done", done); }
}
function applyFs(){ document.documentElement.style.setProperty("--fs", load("fs",30) + "px"); }

/* ---- 启动 ---- */
applyFs();
if (load("hc",false)) document.documentElement.classList.add("hc");
renderList();
</script>
</body>
</html>
