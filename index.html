<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese with Shun · 日中精读</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:640px;margin:0 auto;padding:28px 18px;line-height:1.75;color:#1a1a1a;background:#fff}
h1{font-size:23px;margin:0 0 4px}
.sub{color:#555;font-size:15px;margin:0 0 20px}
.box{background:#f5f5f5;border:1px solid #ddd;border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14.5px}
.box b{font-size:16px}
a{color:#0b57d0}
code{background:#eee;padding:1px 5px;border-radius:3px;font-size:13.5px}
</style></head><body>
<h1>🎙 Japanese with Shun</h1>
<p class="sub">日中对照精读 · 引导页（地址永久不变）</p>
<div class="box">
<b>当前内容站</b><br>
<a id="s" href="#">读取中…</a>
</div>
<div class="box">
<b>APK 下载</b><br>
<a id="a" href="#">读取中…</a>
</div>
<div class="box" style="font-size:13.5px;color:#555">
版本 <code id="v">-</code> · 更新于 <code id="t">-</code><br>
<span id="n"></span>
</div>
<script>
fetch('version.json',{cache:'no-store'})
 .then(r=>r.json()).then(j=>{
   document.getElementById('s').href=j.site||'#';
   document.getElementById('s').textContent=j.site||'（未配置）';
   document.getElementById('a').href=j.apk||'#';
   document.getElementById('a').textContent=j.apk||'（未配置）';
   document.getElementById('v').textContent=(j.ver||'-')+' / '+(j.verName||'-');
   document.getElementById('t').textContent=(j.updated||'-').replace('T',' ').slice(0,16);
   document.getElementById('n').textContent=j.note||'';
 }).catch(e=>{document.getElementById('s').textContent='读取失败：'+e;});
</script>
</body></html>
