<!DOCTYPE html>
<html lang="zh-CN" data-shell-project="shun">
<head>
  <!-- 独立站点模式：不需要 hub 外壳 -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fdf3fb">
<title>Japanese with Shun · 日中对照精读</title>

<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
<!-- 共享外壳：主题 / 字号（放在自己 style.css 之后） -->
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="ai-client.css">
</head>
<body>
<div id="app">

  <!-- 顶栏 46px：‹ 返回 | 集数徽章 | 剧名 + 副标题 | Aa | ☰
       剧名必须常驻（这一系列好几个同款 App，用户曾在里面认错过站） -->
  <header id="topbar" class="sh-topbar">
    <button id="btnBack" class="sh-btn hidden" aria-label="返回">‹</button>
    <button id="btnEp" class="sh-badge" title="选集">
      <span id="epLabel">第1集</span>
    </button>
    <div class="sh-brand">
      <h1 id="seriesLabel">🎙 Japanese with Shun</h1>
      <p id="seriesSub">日语播客 · 日中对照精读</p>
    </div>
    <button id="btnFont" class="sh-btn" title="字号">Aa</button>
    <button id="btnMore" class="sh-btn" title="更多">☰</button>
  </header>

  <!-- ============ 播放页（主体：字幕流） ============ -->
  <section id="viewPlayer" class="view view-player">
    <main id="stream" class="stream">
      <div id="cueBox" class="cue-box"></div>
    </main>

    <!-- 播放条：单行，尽量矮，把屏幕让给字幕 -->
    <footer id="playbar">
      <button id="btnPlay" class="pb-play" aria-label="播放">▶</button>
      <div id="scrub" class="scrub"><div id="scrubFill" class="scrub-fill"></div><div id="scrubDot" class="scrub-dot"></div></div>
      <span id="timeLabel" class="time">0:00 / 0:00</span>
    </footer>

    <!-- 底栏工具条 52px：横向可滚，文字按钮（老花眼看图标费劲） -->
    <div id="tools" class="tools">
      <button class="tool" id="btnBack10" title="后退 10 秒">«10</button>
      <button class="tool" id="btnFwd10" title="前进 10 秒">10»</button>
      <button class="tool" id="btnLoopOne2" title="单句循环">單句循環</button>
      <button class="tool" id="btnTrad2" title="中日对照 / 只看日文">雙語</button>
      <button class="tool" id="btnFontBig2" title="放大字体">A＋</button>
      <button class="tool" id="btnDl" title="把本集音频存到手机">⬇ 下載</button>
    </div>
  </section>

  <!-- ============ 学习页：我的收藏 + 句型表（只有这两个 tab） ============ -->
  <section id="viewStudy" class="view view-study hidden">
    <div class="study-head">
      <div class="tabs" id="studyTabs">
        <button class="tab on" data-tab="fav">我的收藏</button>
        <button class="tab" data-tab="pat">句型表</button>
      </div>
      <span class="muted" id="studyCount"></span>
    </div>
    <div id="studyList" class="study-list"></div>
  </section>

  <!-- 字号面板（点 Aa 弹出） -->
  <div id="fontPanel" class="panel hidden">
    <div class="fp-row">
      <button class="fp-btn" data-fs="-2">A−</button>
      <input id="fsRange" type="range" min="14" max="40" step="1" value="30">
      <button class="fp-btn" data-fs="2">A＋</button>
    </div>
    <div class="fp-presets">
      <button class="fp-p" data-preset="22">小</button>
      <button class="fp-p" data-preset="26">标准</button>
      <button class="fp-p" data-preset="30">大</button>
      <button class="fp-p" data-preset="34">特大</button>
    </div>
    <div class="fp-note">字幕字号 · 弹窗里的字在弹窗里单独调</div>
  </div>

  <!-- 更多菜单（☰） -->
  <div id="morePanel" class="panel hidden">
    <div class="mp-row"><span>学习页（收藏 / 句型表）</span>
      <button id="btnStudy" class="link">打开 ›</button></div>
    <div class="mp-row"><span>音頻緩存</span>
      <button id="btnCache" class="link">查看 ›</button></div>
    <div class="mp-row"><span>自动跟随播放</span>
      <button id="btnFollow" class="switch on">开</button></div>
    <div class="mp-row"><span>下载 Android App</span>
      <button id="btnApk" class="link">获取 ›</button></div>
    <div class="mp-row mp-ver"><span>版本</span><span id="verLabel">1.0</span></div>
  </div>

  <!-- 选集抽屉 -->
  <div id="epPanel" class="sheet hidden">
    <div class="sheet-hd"><span>🎙 Japanese with Shun · 选择集数</span></div>
    <div id="epList" class="ep-list"></div>
    <div class="sheet-ft">
      <button id="btnApk2" class="ghost ghost-dl">⬇ 下载 Android App（12 集音频内置，离线可听）</button>
      <button id="btnCloseEp" class="ghost">关闭</button>
    </div>
  </div>

  <!-- 音频缓存 -->
  <div id="cachePanel" class="sheet hidden">
    <div class="sheet-hd"><span>音頻緩存</span></div>
    <div class="sheet-body">
      <div class="cache-row"><span>已缓存</span><b id="cacheVal">0 集 · 0 MB</b></div>
      <div class="cache-note" id="cacheNote">网页版把音频存在浏览器缓存里，断网也能听。</div>
      <button id="btnClearCache" class="ghost danger">全部刪除</button>
    </div>
    <div class="sheet-ft"><button id="btnCloseCache" class="ghost">关闭</button></div>
  </div>

  <!-- 详解大弹窗（占屏 92%，不是就地展开） -->
  <div id="exSheet" class="ex-sheet hidden" role="dialog" aria-modal="true">
    <div class="ex-sheet-hd">
      <b>详解</b>
      <span id="exTime" class="ex-time">0:00</span>
      <button id="exAa" class="mini-btn" title="弹窗字号">Aa</button>
      <button id="exDl" class="mini-btn" title="把本集音频存到手机">⬇ 存本集</button>
      <button id="exJump" class="mini-btn" title="跳到这句">▶ 跳到這句</button>
      <button id="exClose" class="mini-btn" title="收起">收起 ▲</button>
      <button id="exX" class="sh-btn" aria-label="关闭">✕</button>
    </div>
    <!-- 弹窗字号条：点 Aa 就地展开（独立于字幕字号） -->
    <div id="exSizeBar" class="ex-sizebar hidden">
      <span class="ex-sizebar-l">字號</span>
      <input id="pfsRange" type="range" min="14" max="30" step="1" value="17" data-shell-pfs>
      <span class="ex-sizebar-v" id="pfsVal">17</span>
      <button class="fp-p" data-pfs="14">小</button>
      <button class="fp-p" data-pfs="17">標準</button>
      <button class="fp-p" data-pfs="21">大</button>
      <button class="fp-p" data-pfs="25">特大</button>
    </div>
    <div id="exBody" class="ex-sheet-body"></div>
  </div>
  <div id="exMask" class="ex-mask hidden"></div>

  <!-- 字幕流里点词 → 只查这个词（小卡片，不是整句弹窗） -->
  <div id="wordCard" class="word-card hidden"></div>

  <audio id="au" preload="none"></audio>
</div>

<script src="shell.js"></script>
<script src="boot.js"></script>
<script src="ai-client.js"></script>
<script src="shun-ai.js"></script>
<script src="shun-ai-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
