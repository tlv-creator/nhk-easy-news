/* 音檔來源（依序嘗試；第一個通的就被使用） */
var SOURCES = [{"id":"gh","name":"網路","base":"https://github.com/tlv-creator/nhk-easy-news/releases/download/prajna-audio-v1/"}];

var au=document.getElementById('au'), st=document.getElementById('status');
var curVol=-1, srcIdx=0, speeds=[1,1.25,1.5,0.75], spIdx=0, autoNext=true;
var done=JSON.parse(localStorage.getItem('prajna_done')||'{}');
var last=JSON.parse(localStorage.getItem('prajna_last')||'null');
var localMap=JSON.parse(localStorage.getItem('prajna_local')||'{}'); /* vol -> fileName */

function fmt(s){ if(!isFinite(s)||s<0) s=0; s=Math.floor(s);
  var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); }
function say(msg,isErr){ st.textContent=msg; st.className='status'+(isErr?' err':''); }

/* ---------- 卷目 ---------- */
function buildList(){
  var el=document.getElementById('list');
  el.innerHTML='';
  VOLS.forEach(function(v){
    var d=document.createElement('div');
    d.className='it'+(done[v.vol]?' done':'');
    d.setAttribute('data-vol',v.vol);
    d.innerHTML='<span class="n">'+v.vol+'</span><span class="t">般若經'+v.vol+'卷'+
                (v.test?'<span class="miss">（測試音）</span>':'')+'</span><span class="d" data-dur></span>';
    d.onclick=function(){ pick(v.vol); };
    el.appendChild(d);
  });
  paintDur();
}
function paintDur(){
  document.querySelectorAll('.it').forEach(function(d){
    var vol=+d.getAttribute('data-vol');
    var v=VOLS.filter(function(x){return x.vol===vol})[0];
    var span=d.querySelector('[data-dur]');
    if(v&&v.dur) span.textContent=fmt(v.dur);
    else span.textContent=(localMap[vol]?'本地':'');
  });
}
function markCur(){
  document.querySelectorAll('.it').forEach(function(d){
    d.classList.toggle('cur', +d.getAttribute('data-vol')===curVol);
  });
}

/* ---------- 選卷 ---------- */
function findVol(vol){
  for(var i=0;i<VOLS.length;i++) if(VOLS[i].vol===vol) return VOLS[i];
  return null;
}
function pick(vol){
  var v=findVol(vol);
  if(!v){ say('清單裡沒有第 '+vol+' 卷。',true); return; }
  curVol=vol; markCur();
  document.getElementById('curVol').textContent=vol;
  document.getElementById('curTitle').textContent='般若經'+vol+'卷'+(v.test?'　（測試音，非經文）':'');
  document.getElementById('curTot').textContent=' / '+VOLS.length+' 卷';
  localStorage.setItem('prajna_last', JSON.stringify({vol:vol,t:0}));
  if(localMap[vol]){ playLocal(vol); return; }
  if(!v.file){
    say('第 '+vol+' 卷還沒上傳。可以先聽已上傳的卷，或按「用手機裡的 mp3」離線聽。',true);
    au.removeAttribute('src'); au.load(); return;
  }
  playOnline(vol);
}

/* ---------- 線上播放（多來源依序 fallback） ---------- */
function urlFor(vol,srcIdx){
  var v=findVol(vol); if(!v) return '';
  var base=SOURCES[srcIdx].base;
  return base + encodeURIComponent(v.file);
}
function playOnline(vol){
  if(srcIdx>=SOURCES.length){
    say('所有來源都連不上。請檢查網路，或按「用手機裡的 mp3」離線聽。',true);
    au.removeAttribute('src'); au.load(); return;
  }
  var u=urlFor(vol,srcIdx);
  say('載入中（第 '+(srcIdx+1)+'/'+SOURCES.length+' 個來源）…');
  au.src=u;
  au.playbackRate=speeds[spIdx];
  var p=au.play();
  if(p&&p.catch) p.catch(function(){
    say('這個來源自動播放被擋了，請按一下「播放」。');
  });
}
au.addEventListener('error',function(){
  if(!au.src) return;
  if(srcIdx+1<SOURCES.length){
    srcIdx++; say('這個來源不行，換下一個…'); playOnline(curVol);
  }else{
    say('全部來源都失敗。可以改用「用手機裡的 mp3」離線聽。',true);
  }
});
au.addEventListener('waiting',function(){ say('緩衝中…'); });
au.addEventListener('playing',function(){
  say('播放中　'+(SOURCES[srcIdx]?SOURCES[srcIdx].name:''));
});
au.addEventListener('pause',function(){
  if(!au.ended) say('已暫停（記住位置：'+fmt(au.currentTime)+'）');
});
au.addEventListener('ended',function(){
  if(curVol>0) done[curVol]=1;
  localStorage.setItem('prajna_done',JSON.stringify(done));
  buildList(); markCur();
  if(autoNext){
    var i=VOLS.findIndex(function(x){return x.vol===curVol});
    if(i>=0&&i+1<VOLS.length){ say('本卷結束，接下一卷…'); pick(VOLS[i+1].vol); }
    else say('已是最後一卷。');
  } else say('本卷結束。');
});
au.addEventListener('timeupdate',function(){
  var c=au.currentTime,d=au.duration;
  document.getElementById('fill').style.width=(d? (c/d*100):0)+'%';
  document.getElementById('barTxt').textContent=fmt(c)+' / '+fmt(d);
  if(curVol>0) localStorage.setItem('prajna_last',JSON.stringify({vol:curVol,t:c}));
});
au.addEventListener('loadedmetadata',function(){
  var v=findVol(curVol);
  if(v&&!v.dur&&au.duration&&isFinite(au.duration)){ v.dur=au.duration; paintDur(); }
});

/* ---------- 本地 mp3（按檔名卷號對號） ---------- */
function volFromName(n){
  var m=n.match(/(?:^|[^0-9])([0-9]{3})(?:[^0-9]|$)/);
  if(m){ var n2=+m[1]; if(n2>=398&&n2<=478) return n2; }
  return -1;
}
function playLocal(vol){
  var f=localMap[vol];
  if(!f){ playOnline(vol); return; }
  au.src=f; au.playbackRate=speeds[spIdx];
  say('本地檔案播放中：'+f);
  var p=au.play(); if(p&&p.catch) p.catch(function(){ say('請按一下「播放」。'); });
}
document.getElementById('fileInput').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var vol=volFromName(f.name);
  if(vol<0){ say('檔名裡找不到卷號（398–478）。請把檔名改成「般若經398卷.mp3」這樣。',true); return; }
  localMap[vol]=f.name;
  localStorage.setItem('prajna_local',JSON.stringify(localMap));
  srcIdx=SOURCES.length; /* 本地優先，不再走網路 */
  pick(vol);
});

/* ---------- 控制 ---------- */
document.getElementById('btnPlay').onclick=function(){
  if(curVol<0){ if(VOLS.length) pick(VOLS[0].vol); return; }
  if(au.paused){ var p=au.play(); if(p&&p.catch) p.catch(function(){ say('請再按一次播放。'); }); }
  else au.pause();
};
document.getElementById('btnStop').onclick=function(){ au.pause(); au.removeAttribute('src'); au.load(); say('已停止。'); };
document.getElementById('btnPrev').onclick=function(){
  var i=VOLS.findIndex(function(x){return x.vol===curVol});
  if(i>0) pick(VOLS[i-1].vol); else say('已是第一卷。');
};
document.getElementById('btnNext').onclick=function(){
  var i=VOLS.findIndex(function(x){return x.vol===curVol});
  if(i>=0&&i+1<VOLS.length) pick(VOLS[i+1].vol); else say('已是最後一卷。');
};
document.getElementById('btnSpeed').onclick=function(){
  spIdx=(spIdx+1)%speeds.length; au.playbackRate=speeds[spIdx];
  document.getElementById('btnSpeed').textContent='速度 '+speeds[spIdx].toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'x';
  say('速度 '+speeds[spIdx]+'x');
};
document.getElementById('btnAuto').onclick=function(){
  autoNext=!autoNext;
  document.getElementById('btnAuto').textContent='連播：'+(autoNext?'開':'關');
};
document.getElementById('btnRetry').onclick=function(){
  if(curVol>0){ srcIdx=0; playOnline(curVol); }
};
document.getElementById('btnLocal').onclick=function(){ document.getElementById('fileInput').click(); };

/* ---------- 啟動 ---------- */
buildList();
if(last&&findVol(last.vol)){
  say('上次聽到第 '+last.vol+' 卷（'+fmt(last.t||0)+'），點「播放」接著聽。');
  document.getElementById('curVol').textContent=last.vol;
  document.getElementById('curTitle').textContent='般若經'+last.vol+'卷';
  document.getElementById('curTot').textContent=' / '+VOLS.length+' 卷';
  curVol=last.vol; markCur();
}
</script>
